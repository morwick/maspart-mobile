# Heap dikecilkan ke 1G: laptop ini RAM 7.7GB, -Xmx2G bikin Gradle OOM
# (JVM crash "insufficient memory") saat build berbarengan dgn Chrome dll.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Nonaktifkan Kotlin incremental compilation — project di D:\ tapi pub cache
# plugin di C:\. Kotlin incremental compiler gagal hitung path relatif lintas
# drive ("different roots") → build crash. Disabling ini menghindari bug tsb.
kotlin.incremental=false
